name: Polhub
options:
  bundleIdPrefix: fr.paulmailhes
settings:
  base:
    # The version comes from the VERSION file, passed by the Makefile (make app, scripts/release.sh).
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Apple's notarization refuses a signature without a secure timestamp or with get-task-allow, which
    # Xcode adds on its own unless told not to.
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
packages:
  Kernel:
    path: Packages/Kernel
  MeetingsMac:
    path: Packages/MeetingsMac
targets:
  Polhub:
    type: application
    platform: macOS
    sources:
      - path: App/Polhub
        excludes:
          - "*.plist"
          - "*.entitlements"
      # The relaunch agent's plist must sit where SMAppService looks for it.
      - path: App/Polhub/fr.paulmailhes.polhub.relance.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: Kernel
        product: Observability
      - package: Kernel
        product: Domain
      - package: Kernel
        product: Persistence
      - package: MeetingsMac
        product: ProbeKit
      - package: MeetingsMac
        product: MeetingDetection
      - package: MeetingsMac
        product: Recording
      - package: MeetingsMac
        product: Pipeline
      - package: MeetingsMac
        product: MeetingsUI
      - package: MeetingsMac
        product: ProjectsUI
      - package: MeetingsMac
        product: Summarization
      - package: MeetingsMac
        product: PolhubDesign
      - package: MeetingsMac
        product: Notifications
      # « Inspiration » (16/11): its collection and its tagger, run by the app.
      - package: MeetingsMac
        product: Inspiration
      # Step 2: the computing process and the command line, in Contents/Helpers.
      - target: PolhubCalcul
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: PolhubCLI
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_NAME: Polhub
        PRODUCT_BUNDLE_IDENTIFIER: fr.paulmailhes.polhub
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "6.0"
        # Info.plist is written by hand: Xcode drops NSAudioCaptureUsageDescription from generated ones.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Polhub/Info.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: CQ43U6XX4Z
        CODE_SIGN_ENTITLEMENTS: App/Polhub/Polhub.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # The icon, made with Icon Composer's layers so macOS gives it Liquid Glass (14/11).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PolhubDev:
    type: application
    platform: macOS
    sources:
      - path: App/Polhub
        excludes:
          - "*.plist"
          - "*.entitlements"
    dependencies:
      - package: Kernel
        product: Observability
      - package: Kernel
        product: Domain
      - package: Kernel
        product: Persistence
      - package: MeetingsMac
        product: ProbeKit
      - package: MeetingsMac
        product: MeetingDetection
      - package: MeetingsMac
        product: Recording
      - package: MeetingsMac
        product: Pipeline
      - package: MeetingsMac
        product: MeetingsUI
      - package: MeetingsMac
        product: ProjectsUI
      - package: MeetingsMac
        product: Inspiration
      - target: PolhubCalcul
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: PolhubCLI
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_NAME: "Polhub Dev"
        PRODUCT_BUNDLE_IDENTIFIER: fr.paulmailhes.polhub.dev
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "6.0"
        # Info.plist is written by hand: Xcode drops NSAudioCaptureUsageDescription from generated ones.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Polhub/Info-dev.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: CQ43U6XX4Z
        CODE_SIGN_ENTITLEMENTS: App/Polhub/Polhub.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # The icon, made with Icon Composer's layers so macOS gives it Liquid Glass (14/11).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # polhub-calcul: the models live only in this process (WhisperKit, Silero), never in the app.
  PolhubCalcul:
    type: tool
    platform: macOS
    sources:
      - path: Packages/MeetingsMac/Sources/PolhubCalcul
    dependencies:
      - package: MeetingsMac
        product: Compute
      - package: MeetingsMac
        product: Transcription
    settings:
      base:
        PRODUCT_NAME: polhub-calcul
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: CQ43U6XX4Z
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  # polhub: the meetings read-only, for the terminal and Claude Code (MCP).
  PolhubCLI:
    type: tool
    platform: macOS
    sources:
      - path: Packages/MeetingsMac/Sources/PolhubCLI
    dependencies:
      - package: MeetingsMac
        product: ReadingKit
      - package: Kernel
        product: Persistence
    settings:
      base:
        PRODUCT_NAME: polhub
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: CQ43U6XX4Z
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
schemes:
  Polhub:
    build:
      targets:
        Polhub: all
    run:
      config: Debug
  PolhubDev:
    build:
      targets:
        PolhubDev: all
    run:
      config: Debug
