name: hub-board
options:
  bundleIdPrefix: fr.paulmailhes
settings:
  base:
    # The version comes from the VERSION file, passed by the Makefile (make app, scripts/release.sh).
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Apple's notarization refuses a signature without a secure timestamp or with get-task-allow, which
    # Xcode adds on its own unless told not to.
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
packages:
  Kernel:
    path: Packages/Kernel
  MeetingsMac:
    path: Packages/MeetingsMac
  # What the Mac and the iPhone say to each other (20/11).
  Link:
    path: Packages/Link
targets:
  Hub:
    type: application
    platform: macOS
    sources:
      - path: App/Hub
        excludes:
          - "*.plist"
          - "*.entitlements"
      # The relaunch agent's plist must sit where SMAppService looks for it.
      - path: App/Hub/fr.paulmailhes.polhub.relance.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: Kernel
        product: Observability
      - package: Kernel
        product: Domain
      - package: Kernel
        product: Persistence
      - package: MeetingsMac
        product: ProbeKit
      # Colin (17/11): the Claude Code that Polhub launches, stopped with the app.
      - package: MeetingsMac
        product: Colin
      - package: MeetingsMac
        product: MeetingDetection
      - package: MeetingsMac
        product: Recording
      - package: MeetingsMac
        product: Pipeline
      - package: MeetingsMac
        product: MeetingsUI
      - package: Link
        product: HubLink
      - package: Link
        product: HubCloud
      - package: MeetingsMac
        product: ProjectsUI
      - package: MeetingsMac
        product: Summarization
      - package: MeetingsMac
        product: HubDesign
      - package: MeetingsMac
        product: Notifications
      # « Inspiration » (16/11): its collection and its tagger, run by the app.
      - package: MeetingsMac
        product: Inspiration
      # Step 2: the computing process and the command line, in Contents/Helpers.
      - target: HubCalcul
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: HubCLI
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_NAME: hub
        # The app and the command line are both called hub: their Swift modules need names of their own.
        PRODUCT_MODULE_NAME: HubApp
        PRODUCT_BUNDLE_IDENTIFIER: fr.paulmailhes.polhub
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "6.0"
        # Info.plist is written by hand: Xcode drops NSAudioCaptureUsageDescription from generated ones.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Hub/Info.plist
        # iCloud (20/11) needs a provisioning profile: Xcode makes it with Paul's account (`make app` archives, then exports
        # signed Developer ID). Measured in prive/docs/mesures/2026-11-20-icloud-signature.md.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: CQ43U6XX4Z
        CODE_SIGN_ENTITLEMENTS: App/Hub/Hub.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # The icon, made with Icon Composer's layers so macOS gives it Liquid Glass (14/11).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HubDev:
    type: application
    platform: macOS
    sources:
      - path: App/Hub
        excludes:
          - "*.plist"
          - "*.entitlements"
    dependencies:
      - package: Kernel
        product: Observability
      - package: Kernel
        product: Domain
      - package: Kernel
        product: Persistence
      - package: MeetingsMac
        product: ProbeKit
      # Colin (17/11): the Claude Code that Polhub launches, stopped with the app.
      - package: MeetingsMac
        product: Colin
      - package: MeetingsMac
        product: MeetingDetection
      - package: MeetingsMac
        product: Recording
      - package: MeetingsMac
        product: Pipeline
      - package: MeetingsMac
        product: MeetingsUI
      - package: Link
        product: HubLink
      - package: Link
        product: HubCloud
      - package: MeetingsMac
        product: ProjectsUI
      - package: MeetingsMac
        product: Inspiration
      - target: HubCalcul
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: HubCLI
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_NAME: "hub dev"
        PRODUCT_BUNDLE_IDENTIFIER: fr.paulmailhes.polhub.dev
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "6.0"
        # Info.plist is written by hand: Xcode drops NSAudioCaptureUsageDescription from generated ones.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Hub/Info-dev.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: CQ43U6XX4Z
        # Without iCloud: the development build has no provisioning profile.
        CODE_SIGN_ENTITLEMENTS: App/Hub/HubDev.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # The icon, made with Icon Composer's layers so macOS gives it Liquid Glass (14/11).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # hub-calcul: the models live only in this process (WhisperKit, Silero), never in the app.
  HubCalcul:
    type: tool
    platform: macOS
    sources:
      - path: Packages/MeetingsMac/Sources/HubCalcul
    dependencies:
      - package: MeetingsMac
        product: Compute
      - package: MeetingsMac
        product: Transcription
    settings:
      base:
        PRODUCT_NAME: hub-calcul
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: CQ43U6XX4Z
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  # hub: the meetings read-only, for the terminal and Claude Code (MCP).
  HubCLI:
    type: tool
    platform: macOS
    sources:
      - path: Packages/MeetingsMac/Sources/HubCLI
    dependencies:
      - package: MeetingsMac
        product: ReadingKit
      - package: Kernel
        product: Persistence
      - package: Kernel
        product: Domain
    settings:
      base:
        PRODUCT_NAME: hub
        PRODUCT_MODULE_NAME: HubTool
        MACOSX_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: CQ43U6XX4Z
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  # Polhub on the iPhone (20/11): the same name on screen, its own identifier, TestFlight.
  HubPhone:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: App/HubPhone
        excludes:
          - "*.plist"
          - "*.entitlements"
      - path: App/Hub/AppIcon.icon
    dependencies:
      - package: Link
        product: HubLink
      - package: Link
        product: HubCloud
      # The notification extension (20/11): it opens the sealed notifications.
      - target: HubPhoneNotifications
    settings:
      base:
        PRODUCT_NAME: hub
        PRODUCT_BUNDLE_IDENTIFIER: fr.paulmailhes.polhub.ios
        IPHONEOS_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/HubPhone/Info.plist
        # The notifications (20/11): Apple's push service, production (TestFlight).
        CODE_SIGN_ENTITLEMENTS: App/HubPhone/HubPhone.entitlements
        MARKETING_VERSION: "1.0.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CQ43U6XX4Z
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
        OTHER_CODE_SIGN_FLAGS: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # hub's notifications on the iPhone, opened (20/11): Apple carries them sealed, this extension shows their words.
  HubPhoneNotifications:
    type: app-extension
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: App/HubPhoneNotifications
        excludes:
          - "*.plist"
          - "*.entitlements"
      - path: App/HubPhone/PushKeyStore.swift
    dependencies:
      - package: Link
        product: HubLink
    settings:
      base:
        PRODUCT_NAME: HubPhoneNotifications
        PRODUCT_BUNDLE_IDENTIFIER: fr.paulmailhes.polhub.ios.notifications
        IPHONEOS_DEPLOYMENT_TARGET: "27.0"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/HubPhoneNotifications/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/HubPhoneNotifications/HubPhoneNotifications.entitlements
        MARKETING_VERSION: "1.0.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CQ43U6XX4Z
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
        OTHER_CODE_SIGN_FLAGS: ""
schemes:
  HubPhone:
    build:
      targets:
        HubPhone: all
    run:
      config: Debug
  Hub:
    build:
      targets:
        Hub: all
    run:
      config: Debug
  HubDev:
    build:
      targets:
        HubDev: all
    run:
      config: Debug
